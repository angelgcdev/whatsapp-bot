<aside
  class="w-64 bg-surface-container-lowest border-r border-outline-variant/30 flex flex-col h-screen select-none shrink-0 transition-colors duration-200"
>
  <!-- Brand / Header -->
  <div class="h-16 flex items-center px-6 gap-3 border-b border-outline-variant/30">
    <div
      class="w-9 h-9 rounded-xl bg-on-surface text-surface flex items-center justify-center shadow-sm"
    >
      <svg lucideBot class="w-5 h-5 stroke-[2]"></svg>
    </div>
    <div>
      <h1 class="text-sm font-extrabold text-on-surface tracking-tight">AILINK BOT</h1>
      <p
        class="text-[10px] text-tertiary font-bold uppercase tracking-wider flex items-center gap-1.5 mt-0.5"
      >
        <span class="w-1.5 h-1.5 rounded-full bg-primary-container animate-pulse"></span>
        WhatsApp Cloud
      </p>
    </div>
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 px-3 py-4 space-y-1.5 overflow-y-auto">
    <!-- Inbox -->
    <a
      routerLink="/conversations"
      routerLinkActive="bg-on-surface text-surface font-semibold shadow-sm [&_svg]:text-surface"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-on-surface-variant hover:bg-surface-container-low hover:text-on-surface transition-all group cursor-pointer"
    >
      <svg
        lucideMessageSquare
        class="w-4 h-4 text-outline group-hover:text-on-surface transition-colors"
      ></svg>
      <span>Conversaciones</span>
    </a>

    <!-- Bot Triggers / Responses -->
    <a
      routerLink="/bot-responses"
      routerLinkActive="bg-on-surface text-surface font-semibold shadow-sm [&_svg]:text-surface"
      class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-on-surface-variant hover:bg-surface-container-low hover:text-on-surface transition-all group cursor-pointer"
    >
      <svg
        lucideZap
        class="w-4 h-4 text-outline group-hover:text-on-surface transition-colors"
      ></svg>
      <span>Respuestas del Bot</span>
    </a>

    <!-- Dashboard (Placeholder) -->
    <div
      class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-outline/50 cursor-not-allowed"
    >
      <svg lucideLayoutDashboard class="w-4 h-4 text-outline/40"></svg>
      <span>Dashboard</span>
      <span
        class="ml-auto text-[10px] bg-surface-container text-on-surface-variant px-1.5 py-0.5 rounded font-mono"
        >Próx.</span
      >
    </div>
  </nav>

  <!-- Footer Profile & Theme Switch -->
  <div class="p-3 border-t border-outline-variant/30 space-y-3">
    <!-- Theme Toggle Button -->
    <button
      type="button"
      (click)="themeService.toggleTheme()"
      class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold text-on-surface-variant bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 transition-all cursor-pointer"
    >
      <span class="flex items-center gap-2">
        @if (themeService.isDarkMode()) {
          <svg lucideSun class="w-4 h-4 text-tertiary"></svg>
          <span class="text-on-surface">Modo Claro</span>
        } @else {
          <svg lucideMoon class="w-4 h-4 text-secondary"></svg>
          <span class="text-on-surface">Modo Oscuro</span>
        }
      </span>
      <span class="text-[10px] font-mono text-outline uppercase font-bold">
        {{ themeService.isDarkMode() ? 'Dark' : 'Light' }}
      </span>
    </button>

    <!-- User Profile Badge -->
    <div
      class="flex items-center gap-3 p-2 rounded-xl bg-surface-container-low border border-outline-variant/30"
    >
      <div
        class="w-8 h-8 rounded-full bg-secondary text-white font-bold text-xs flex items-center justify-center"
      >
        C
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-bold text-on-surface truncate">cuentas@ailinkvip.com</p>
        <p class="text-[10px] text-on-surface-variant truncate">Administrador</p>
      </div>
    </div>
  </div>
</aside>
